name: SecurteGate Pipeline

on:
  pull_request:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --report-path=gitleaks-results.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install SonarScanner CLI
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip
          unzip sonar-scanner.zip -d $HOME
          echo "$HOME/sonar-scanner-5.0.1.3006/bin" >> $GITHUB_PATH

      - name: Run SonarCloud Scan
        run: |
          sonar-scanner \
            -Dsonar.projectKey=pa1-sre \
            -Dsonar.organization=pa1-sre \
            -Dsonar.python.version=3.9 \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.host.url=https://sonarcloud.io

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'
          exit-code: 1

  build-sign-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        run: docker build -t securegate-app:latest .

      - name: Install Syft (SBOM Generator)
        uses: anchore/sbom-action@v0
        with:
          image: securegate-app:latest
          artifact-name: container-sbom.json
          output-file: container-sbom.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify Cosign Installation
        run: cosign version

      - name: Sign Container Image (Keyless Demo)
        run: |
          echo "Simulating signature for local build..."
          echo "Cosign tool is ready and configured for keyless signing!"

  dast-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run app container
        run: |
          docker build --no-cache -t securegate-app:latest .
          docker run -d -p 3000:3000 --name running-app securegate-app:latest
          sleep 5

      - name: Debug Container & Health Check
        run: |
          echo "=== Container Status ==="
          docker ps -a
          echo "=== Container Logs ==="
          docker logs running-app
          echo "=== Testing Local Connection ==="
          curl -v http://127.0.0.1:3000 || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:3000'
          fail_action: false

      - name: Ensure ZAP Report Exists
        run: |
          if [ ! -f report_json.json ]; then
            echo "{}" > report_json.json
          fi

  upload-reports:
    needs: [secrets-scan, trivy-scan, dast-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Upload Scan Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-results.json
            trivy-results.json
            report_json.json
        continue-on-error: true

  ai-triage:
    needs: [upload-reports]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Scan Reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: .
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Run AI Triage (Gemini Flash)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/ai_triage.py

      - name: Publish to GitHub Step Summary & PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('ai_summary.md')) return;
            const summary = fs.readFileSync('ai_summary.md', 'utf8');

            core.summary.addHeading('SecureGate AI Triage Report').addRaw(summary).write();

            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### SecureGate AI Security Triage\n\n${summary}`
              });
            }
