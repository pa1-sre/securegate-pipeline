name: SecurteGate Pipeline

on:
  pull_request

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 #checkout on the runner!
        with: 
          fetch-depth: 0 #to make sure entire commit history is available for scan
      - uses: gitleaks/gitleaks-action@v2 #looks for pattern's like api keys, tokens & passwords
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sast:
   # needs: secrets-scan  # Only runs if secrets-scan passes!
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install SonarScanner CLI
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip
          unzip sonar-scanner.zip -d $HOME
          echo "$HOME/sonar-scanner-5.0.1.3006/bin" >> $GITHUB_PATH

      - name: Run SonarCloud Scan
        run: |
          sonar-scanner \
            -Dsonar.projectKey=pa1-sre \
            -Dsonar.organization=pa1-sre \
            -Dsonar.python.version=3.9 \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.host.url=https://sonarcloud.io
  trivy-scan:
   # needs: sast  # Only runs if sast passes!
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: 1
          
  build-sign-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write #required for Cosign keyless signing!
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally 
        run: 
          docker build -t securegate-app:latest .
          
      - name: Install Syft (SBOM Generator)
        uses: anchore/sbom-action@v0
        with:
          image: securegate-app:latest
          artifact-name: container-sbom.json
          output-file: container-sbom.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify Cosign Installation
        run: cosign version

      # Note: For local non-pushed images in CI, we demonstrate the tool setup and signing mechanics. 
      # When pushing to a real registry (like GitHub Packages or Docker Hub), you would sign the image digest.
      - name: Sign Container Image (Keyless Demo)
        run:
          echo "Simulating signature for local build..."
          echo "Cosign tool is ready and configured for keyless signing!"

  dast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run app container
        run:
          docker build -t securegate-app:latest .
          docker run -d -p 5000:5000 --name running-app securegate-app:latest
          sleep 5 #giving app 5 seconds to fully initialize

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5000'
          fail_action: false # Set to false for baseline demo so missing headers don't hard-fail the entire build while learning ZAP logs

